appId: com.proxmoxapp.desktop
productName: Proxmox VE Manager
copyright: Copyright © 2026

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json

# Chỉ đóng gói `dependencies`. Toàn bộ thư viện của renderer nằm ở
# `devDependencies` vì Vite đã gộp chúng vào bundle — đưa vào đây nữa
# sẽ khiến installer phình thêm hàng trăm megabyte mà không dùng đến.
npmRebuild: true

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Proxmox-VE-Manager-${version}-${arch}.${ext}
  # Ký số: xem docs/decision-windows-signing.md. Đặt CSC_LINK + CSC_KEY_PASSWORD khi có cert.
  # icon: resources/icon.ico (tuỳ chọn — thiếu thì electron-builder dùng mặc định)

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Proxmox VE Manager
  deleteAppDataOnUninstall: false

# Auto-update: electron-builder ghi app-update.yml khi đóng gói; electron-updater
# đọc feed GitHub Releases (latest.yml + artifact). CI: tag v* → workflow Release.
# releaseType: draft — CI pre-create draft rồi publish sau upload (tránh race
# electron-builder 26 tạo 2 release / tách asset). Repo public → client không cần token.
publish:
  provider: github
  owner: phamhuyti
  repo: Proxmox-App
  releaseType: draft
