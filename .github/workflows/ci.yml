name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # This public repo must not execute fork-supplied code on our own machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check Wine for Windows packaging
        run: |
          command -v wine >/dev/null || { echo "::error::Install Wine on the Linux runner to build the Windows NSIS installer"; exit 1; }
          wine --version
      - name: Package Windows installer without publishing
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --no-install electron-builder --win --x64 --publish never
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ github.sha }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
