name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build & publish Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Sync desktop version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version -w @pve/desktop

      - name: Build & publish Windows installer
        working-directory: apps/desktop
        env:
          # GITHUB_TOKEN đủ quyền contents:write nhờ permissions ở trên.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Chưa có cert → bỏ qua auto-discover (tránh fail trên runner).
          # Khi có EV/OV: đặt secrets CSC_LINK + CSC_KEY_PASSWORD và xoá dòng này.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run release:win
